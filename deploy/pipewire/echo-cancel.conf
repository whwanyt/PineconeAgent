# =============================================================================
# PipeWire 回声消除（aec.mode = pipewire 时使用）
# -----------------------------------------------------------------------------
# 安装位置：~/.config/pipewire/pipewire.conf.d/echo-cancel.conf
# （scripts/install_pi.sh --pipewire-aec 会自动安装并重启 PipeWire）
#
# 加载后会出现两个虚拟设备：
#   Echo-Cancel Sink    —— 播放设备：所有声音（播报、mpv 音乐）都从这里放出去，
#                          模块由此拿到完整的“参考信号”，所以连音乐的回声也能消除
#   Echo-Cancel Source  —— 录音设备：已经去除回声的麦克风信号
#
# 然后在 config/config.local.yaml 中设置：
#   audio:
#     input_device: "Echo-Cancel Source"
#     output_device: "Echo-Cancel Sink"
#     aec: {mode: pipewire}
#   skills:
#     settings:
#       music: {audio_device: "pipewire/echo-cancel-sink"}
#
# 验证：pw-cli ls Node | grep -i echo   或   pactl list short sources
# =============================================================================

context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      # 回声消除算法：WebRTC AEC（含噪声抑制、自动增益）
      library.name = aec/libspa-aec-webrtc
      # 单声道 16kHz 就足够语音识别使用，计算量最小
      audio.rate = 16000
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.high_pass_filter = true
      }
      # 麦克风侧：连接真实麦克风（不指定则使用系统默认输入）
      capture.props = {
        node.name = "echo-cancel-capture"
        node.passive = true
      }
      # 去除回声后的录音设备
      source.props = {
        node.name = "echo-cancel-source"
        node.description = "Echo-Cancel Source"
      }
      # 播放侧：程序往这里放音，模块再转发给真实扬声器
      sink.props = {
        node.name = "echo-cancel-sink"
        node.description = "Echo-Cancel Sink"
      }
      playback.props = {
        node.name = "echo-cancel-playback"
        node.passive = true
      }
    }
  }
]

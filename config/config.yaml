# =============================================================================
# PineconeAgent 主配置
# -----------------------------------------------------------------------------
# - 所有字段都有默认值，只需要写想修改的部分。
# - 机器相关或敏感配置（API Key、设备名）请写到同目录的 config.local.yaml，
#   它会深度合并覆盖本文件，并且不会被提交到 git。
# - 支持环境变量引用：${NAME} 或 ${NAME:默认值}。
# =============================================================================

# 音箱名字，用于自我介绍和 AI 人设。默认：小派
name: 小派

# 运行时数据目录（闹钟、对话记忆等 SQLite 数据库），相对项目根目录。默认：data
data_dir: data

# ---- 日志 ----
log:
  # 日志级别：DEBUG / INFO / WARNING / ERROR。默认：INFO
  level: INFO
  # 日志文件路径；设为 null 只输出到控制台。默认：logs/pinecone.log
  file: logs/pinecone.log
  # 单个日志文件最大字节数，超过后滚动。默认：5MB
  max_bytes: 5242880
  # 保留的历史日志文件个数。默认：3
  backup_count: 3

# ---- 音频 ----
# 执行 `python -m pinecone.audio.devices` 可以列出所有设备及序号
audio:
  # 麦克风：null=系统默认；整数=设备序号；字符串=设备名关键字（不区分大小写，如 "USB"）。默认：null
  input_device: null
  # 扬声器：规则同上。树莓派 5 没有 3.5mm 口，可填 "USB" / "HDMI" / 蓝牙音箱名。默认：null
  output_device: null
  # 送给语音模型的采样率，模型要求 16000，一般不要改。默认：16000
  sample_rate: 16000
  # 每帧时长（毫秒），可选 10/20/30。默认：20
  frame_ms: 20
  # 语音播报音量 0~1。默认：0.8
  volume: 0.8

  # ---- 回声消除（AEC）----
  # 作用：播报时扣除扬声器自己的声音，避免误唤醒，并让“直接开口打断”成为可能。
  aec:
    # 模式。默认：software
    #   none     不处理；只能用唤醒词打断（播报期间自动提高唤醒阈值）。零成本、最简单。
    #   software 进程内软件 AEC（WebRTC / speex），无需额外硬件。初期推荐。
    #            需要安装：uv pip install 'pinecone-agent[aec]'
    #            注意：音乐由 mpv 独立播放，其回声无法在此模式下消除（唤醒后会自动压低音乐音量）。
    #   pipewire 系统级 module-echo-cancel，可以连音乐回声一起消除；
    #            需运行 scripts/install_pi.sh 并把下面设备设为 "Echo-Cancel Source" / "Echo-Cancel Sink"。
    #   hardware 麦克风阵列自带 AEC（如 ReSpeaker USB Mic Array v2.0），程序内不处理。
    mode: software
    # software 模式的算法：auto（优先 webrtc，失败用 speex）/ webrtc / speex。默认：auto
    backend: auto
    # 扬声器到麦克风的大致延迟（毫秒），WebRTC 的初始估计值，会自动校正。默认：60
    stream_delay_ms: 60
    # speex 滤波器长度（毫秒），需覆盖回声延迟和混响。默认：200
    filter_ms: 200
    # webrtc 后端是否同时降噪。默认：true
    noise_suppression: true

  # ---- 对话打断 ----
  barge_in:
    # 播报 / 思考时说唤醒词即可打断（任何 AEC 模式都可用）。默认：true
    wake_word: true
    # 播报时直接开口即可打断；只有回声消除生效时才会真正启用。默认：false
    # 建议先确认 software / pipewire / hardware 回声消除效果良好后再打开。
    vad: false
    # 播报期间唤醒阈值提高量（0~0.7），防止扬声器声音误唤醒。默认：0.15
    wake_threshold_boost: 0.15

# ---- 唤醒词（sherpa-onnx 关键词检测，离线）----
wake:
  # 模型目录，bash scripts/download_models.sh kws 下载。默认：models/kws
  model_dir: models/kws
  # 唤醒词列表，任意中文均可（自动转拼音），建议 3~4 字、不常出现在日常对话中。默认：[小派小派]
  keywords:
    - 小派小派
  # 触发阈值（0~1），越大越不易误唤醒、也越难唤醒。默认：0.25
  threshold: 0.25
  # 唤醒词加分，越大越容易唤醒。默认：1.5
  score: 1.5
  # 推理线程数。默认：1
  num_threads: 1
  # 使用 int8 量化模型（树莓派上更快）。默认：true
  use_int8: true

# ---- 语音活动检测（Silero VAD，离线）----
vad:
  # 模型路径，bash scripts/download_models.sh vad 下载。默认：models/silero_vad.onnx
  model: models/silero_vad.onnx
  # 语音概率阈值（0~1），环境嘈杂可调到 0.6~0.7。默认：0.5
  threshold: 0.5
  # 静音多久算一句话说完（毫秒）。默认：700
  min_silence_ms: 700
  # 短于该时长的声音不算说话（毫秒）。默认：250
  min_speech_ms: 250
  # 单句最长时长（秒），超过强制截断。默认：15
  max_speech_s: 15
  # 唤醒后多久没开口就放弃本次聆听（秒）。默认：6
  no_speech_timeout_s: 6

# ---- 语音识别（SenseVoice-Small，离线）----
asr:
  # 识别引擎，目前支持 sensevoice。默认：sensevoice
  engine: sensevoice
  # 模型目录，bash scripts/download_models.sh asr 下载。默认：models/asr
  model_dir: models/asr
  # 识别语言：auto / zh / en / ja / ko / yue。默认：auto
  language: auto
  # 逆文本正则化（“七点半”→“7点半”、加标点），便于解析时间。默认：true
  use_itn: true
  # 推理线程数。默认：2
  num_threads: 2

# ---- 语音合成 ----
tts:
  # 主引擎：edge（微软在线，免费、自然，需联网）/ local（本地 Matcha，离线）。默认：edge
  engine: edge
  # 主引擎失败（如断网）时的降级：local / none。默认：local
  fallback: local
  # edge 音色，`edge-tts --list-voices | grep zh-CN` 查看。默认：zh-CN-XiaoxiaoNeural
  edge_voice: zh-CN-XiaoxiaoNeural
  # edge 语速，如 "+10%" / "-10%"。默认："+0%"
  edge_rate: "+0%"
  # edge 合成超时（秒），超时改用降级引擎。默认：4
  edge_timeout_s: 4
  # 本地模型目录，bash scripts/download_models.sh tts 下载。默认：models/tts
  local_model_dir: models/tts
  # 本地合成语速，>1 更快。默认：1.0
  local_speed: 1.0
  # 本地合成线程数。默认：2
  num_threads: 2
  # 短句合成结果缓存条数（“好的”这类高频回复零延迟）。默认：64
  cache_size: 64

# ---- 对话流程 ----
dialog:
  # 播报结束后的追问窗口（秒），窗口内无需唤醒词可直接继续说；0 表示关闭。默认：6
  follow_up_s: 6
  # 唤醒成功时播放提示音。默认：true
  wake_beep: true
  # 唤醒成功时的语音应答（如 "我在"），为空只播提示音。默认：""
  wake_reply: ""

# ---- 技能 ----
skills:
  # 启用的技能名，"*" 表示全部（内置 + 插件）。默认：["*"]
  enabled: ["*"]
  # 禁用的技能名（优先于 enabled），例如 [music]。默认：[]
  disabled: []
  # 插件技能目录，每个含 __init__.py 的子目录是一个技能包。默认：[plugins]
  plugin_dirs: [plugins]
  # 各技能的私有配置，键为技能名
  settings:
    alarm:
      # 最长响铃时长（秒），超时自动停止。默认：60
      ring_seconds: 60
      # “再睡一会儿”没说分钟数时的贪睡时长（分钟）。默认：5
      snooze_minutes: 5
    custom_task:
      # 自定义任务目录（相对项目根目录），每个 YAML 文件一个任务，见 tasks/README.md。默认：[tasks]
      dirs: [tasks]
    music:
      # 音乐目录列表，按“歌手/歌名.mp3”或“歌手 - 歌名.mp3”组织便于点歌。默认：[~/Music]
      library: [~/Music]
      # 网络电台：名称 → 流地址，说“播放<名称>”即可收听。默认：{}
      stations: {}
      # 音乐默认音量（0~100）。默认：60
      volume: 60
      # 唤醒 / 播报时音乐音量压低到的比例。默认：0.3
      duck_ratio: 0.3
      # mpv 输出设备，例如 "alsa/plughw:1,0"；null 为系统默认。默认：null
      audio_device: null

# ---- AI 对话（LangChain / LangGraph Agent）----
# 规则技能没有命中的话交给大模型处理；大模型也可以通过工具调用全部技能和自定义任务。
agent:
  # 是否启用 AI。api_key 为空时自动停用。默认：true
  enabled: true
  # OpenAI 兼容接口地址，例如：
  #   DeepSeek  https://api.deepseek.com/v1
  #   通义千问  https://dashscope.aliyuncs.com/compatible-mode/v1
  #   Kimi      https://api.moonshot.cn/v1
  #   Ollama    http://localhost:11434/v1
  base_url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
  # 接口密钥：请设置环境变量 OPENAI_API_KEY，或写在 config.local.yaml 中，不要提交到 git
  api_key: ${OPENAI_API_KEY:}
  # 模型名称。默认：deepseek-chat
  model: ${OPENAI_MODEL:deepseek-chat}
  # 采样温度，越高越发散。默认：0.7
  temperature: 0.7
  # 单次请求超时（秒）。默认：30
  timeout_s: 30
  # 失败重试次数。默认：1
  max_retries: 1
  # 追加的人设 / 要求，例如 "说话带点东北口音"。默认：""
  persona: ""
  # 会话空闲超过多少分钟后开启新会话（短期记忆重新开始，长期记忆保留）。默认：10
  session_idle_min: 10
  # 短期记忆：会话历史超过多少 token 时，把较早的内容压缩成摘要。默认：2000
  summarize_after_tokens: 2000
  # 压缩时保留最近多少条原始消息。默认：10
  keep_messages: 10
  # 会话历史保存天数，启动时清理更早的会话；0 表示永久保存。默认：7
  history_days: 7
  # 长期记忆：AI 可以记住你的称呼、喜好、作息等，跨会话保留（data/agent_memory.db）。默认：true
  long_term_memory: true
  # MCP 服务：接入天气、搜索、Home Assistant 等外部工具，启动时自动加载。默认：{}
  # 服务名只能用英文、数字、下划线，会作为工具名前缀；某个服务连不上不影响其他功能。示例：
  #   mcp_servers:
  #     weather:
  #       transport: stdio                  # 本地进程
  #       command: uvx
  #       args: [mcp-weather-server]
  #     homeassistant:
  #       transport: streamable_http        # 远程 HTTP 服务
  #       url: http://homeassistant.local:8123/mcp_server/sse
  #       headers: {Authorization: "Bearer ${HA_TOKEN}"}
  # transport 可选：stdio / streamable_http / sse / websocket；也兼容 Cursor、ModelScope 等平台
  # 复制来的 type 写法（如 type: streamableHttp），两者都不写时按 command / url 自动推断。
  mcp_servers: {}
